name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing (OIDC):
# no API token is stored. The PyPI side is configured once: project "firstwatch",
# owner dave8172, repo firstwatch, workflow publish-pypi.yml, environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python python/tests/test_firstwatch.py
      - run: python -m pip install --upgrade build twine
      - run: python -m build python --outdir dist
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
